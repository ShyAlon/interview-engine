[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interview-engine"
description = "Adaptive systems-engineering interview: founder's rough idea in, versioned IntentModel out. The moat stage - LLM budget is spent here on purpose."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Shy Alon" }]
dynamic = ["version"]
dependencies = [
  "vmodel-contracts @ git+https://github.com/ShyAlon/vmodel-contracts.git@a226c89f326e076d4a022064f1d75110d8bbb2a5",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "pydantic>=2.6,<3",
  "typesafe-sdk==0.7.0",
  "pyarrow>=17,<24",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.2"]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/interview_engine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_engine"]

[tool.hatch.metadata]
allow-direct-references = true


