[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interview-engine"
description = "Adaptive systems-engineering interview: founder's rough idea in, versioned IntentModel out. The moat stage - LLM budget is spent here on purpose."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Shy Alon" }]
dynamic = ["version"]
dependencies = [
  "vmodel-contracts==0.28.0",
  "requi-child-contract==0.1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2",
  "langgraph-checkpoint-postgres==3.1.2",
  "psycopg[binary]>=3.2,<4",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "pydantic>=2.6,<3",
  "typesafe-sdk==0.7.0",
  "pyarrow>=17,<24",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.2"]
dev = ["pytest>=8", "pgserver>=0.1.4"]

[tool.hatch.version]
path = "src/interview_engine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_engine"]

[tool.hatch.metadata]
allow-direct-references = true



[tool.uv.sources]
requi-child-contract = { path = "vendor/requi_child_contract-0.1.0-py3-none-any.whl" }
vmodel-contracts = { path = "vendor/vmodel_contracts-0.28.0-py3-none-any.whl" }
