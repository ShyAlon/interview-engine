name: test
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # vmodel-contracts is private: clone it over SSH with a read-only deploy key
      # (secret VMODEL_CONTRACTS_DEPLOY_KEY; public half on vmodel-contracts, 2026-09-24).
      - name: deploy key for vmodel-contracts
        env: { DEPLOY_KEY: "${{ secrets.VMODEL_CONTRACTS_DEPLOY_KEY }}" }
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global url."git@github.com:ShyAlon/vmodel-contracts".insteadOf "https://github.com/ShyAlon/vmodel-contracts"
          git config --global --add url."git@github.com:ShyAlon/vmodel-contracts".insteadOf "https://github.com/shyalon/vmodel-contracts"
      - run: pip install -e .[dev]
      - run: pytest -q
