<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#0b0d14;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.08);--line:rgba(255,255,255,.10);--tx:#e8ebf5;--mut:#9aa3ba;--acc:#7c9cff;--acc2:#b07cff;--ok:#3ddc97;--bad:#ff6b81;--warn:#ffc75f;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 500px at 10% -10%,rgba(124,156,255,.18),transparent 60%),radial-gradient(800px 500px at 110% 10%,rgba(176,124,255,.15),transparent 60%),var(--bg)}
header{position:sticky;top:0;z-index:10;background:rgba(11,13,20,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px}
.brand{font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand small{color:var(--mut);font-weight:500;margin-left:6px}
.prog{flex:1;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 14px rgba(124,156,255,.7);border-radius:99px;transition:width .3s}
.pct{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer;transition:.15s}
.btn:hover{border-color:rgba(124,156,255,.6);box-shadow:0 0 0 3px rgba(124,156,255,.15)}
.btn.primary{background:linear-gradient(135deg,rgba(124,156,255,.35),rgba(176,124,255,.35));border-color:rgba(124,156,255,.5)}
main{max-width:1180px;margin:0 auto;padding:20px 22px 40px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.dot{width:26px;height:26px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:11px;display:grid;place-items:center;cursor:pointer}
.dot.done{background:rgba(61,220,151,.18);border-color:rgba(61,220,151,.5);color:#bff5dc}
.dot.cur{box-shadow:0 0 0 2px var(--acc),0 0 16px rgba(124,156,255,.6);color:var(--tx)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.badge.scope{background:rgba(255,199,95,.15);color:var(--warn);border:1px solid rgba(255,199,95,.45);box-shadow:0 0 14px rgba(255,199,95,.25)}
.badge.intent{background:rgba(124,156,255,.15);color:#aebfff;border:1px solid rgba(124,156,255,.45);box-shadow:0 0 14px rgba(124,156,255,.25)}
.cid{color:var(--mut);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.nav{margin-left:auto;display:flex;gap:8px;align-items:center}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:0 0 6px}
.q{font-size:17px;font-weight:600;margin:0 0 14px}
.a{font-size:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0;white-space:pre-wrap}
.ka{color:var(--mut);font-size:13px;margin-top:10px;white-space:pre-wrap}
.rub{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mut)}
.chip b{color:var(--tx);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.sys h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.sys h3 span{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 0 14px rgba(124,156,255,.5)}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:8px}
.field .k{color:var(--mut);font-size:13px}
.val{font-weight:700;font-size:16px}
.val.accepted{color:var(--ok)} .val.rejected{color:var(--bad)}
.conf{display:flex;align-items:center;gap:8px;min-width:130px;justify-content:flex-end}
.cbar{width:70px;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.cbar i{display:block;height:100%;border-radius:99px}
.cn{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px;width:36px;text-align:right}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.ch{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:16px;padding:14px;font:inherit;font-weight:600;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.ch kbd{font:600 11px ui-monospace,monospace;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.ch:hover{border-color:rgba(124,156,255,.6)}
.ch.sel{background:linear-gradient(135deg,rgba(124,156,255,.3),rgba(176,124,255,.3));border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,156,255,.2),0 0 24px rgba(124,156,255,.45)}
.hv{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
select,textarea{width:100%;background:rgba(0,0,0,.25);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font:inherit}
select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,156,255,.2)}
.row{display:flex;gap:10px;margin-bottom:8px;align-items:center}
.row label{min-width:80px;color:var(--mut);font-size:13px}
textarea{min-height:92px;resize:vertical}
.hint{color:var(--mut);font-size:12px;margin-top:14px;text-align:center}
.hint kbd{font:600 11px ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.saved{color:var(--ok);font-size:12px;opacity:0;transition:.3s}
.saved.on{opacity:1}
@media(max-width:800px){.grid,.hv{grid-template-columns:1fr}.choices{grid-template-columns:1fr 1fr}}
</style><style>
.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);cursor:pointer;user-select:none;transition:all .15s;font-size:14px}
.ck:hover{background:rgba(255,255,255,.09)}
.ck input{accent-color:#7c9cff;width:16px;height:16px;margin:0}
.ck.on{background:rgba(124,156,255,.18);border-color:rgba(124,156,255,.6);box-shadow:0 0 14px rgba(124,156,255,.25)}
.multi-hint{font-weight:400;opacity:.55;font-size:12px;margin-left:6px;text-transform:none;letter-spacing:0}
#importBtn{margin-right:8px}
.needv{color:#ffb86b;font-size:13px;margin-right:12px}
.dot.pend{border-color:#ffb86b!important;color:#ffb86b;box-shadow:0 0 10px rgba(255,184,107,.35)}
.hvwarn{color:#ffb86b;font-size:13px;margin:6px 0 0}
</style>
</head><body>
<header><div class="hwrap">
<div class="brand">A/B Labeling<small>__SUBTITLE__ · <span id="total"></span> cases · intent labels __TAXONOMY_VERSION__</small></div>
<div class="prog"><div class="bar"><i id="barfill"></i></div><span class="pct" id="pct"></span></div>
<span class="saved" id="saved">Saved</span>
<span id="needv" class="needv"></span><button class="btn" id="importBtn" title="Restore labels from an exported labeled CSV">Import labels</button><input type="file" id="importFile" accept=".csv,text/csv" style="display:none"><button class="btn primary" id="exportBtn">Export CSV</button>
</div></header>
<main>
<div class="dots" id="dots"></div>
<section class="card">
  <div class="top"><span class="badge" id="slot"></span><span class="cid" id="cid"></span>
    <div class="nav"><button class="btn" id="prev">&larr; Prev</button><span class="pct" id="pos"></span><button class="btn" id="next">Next &rarr;</button></div></div>
  <div id="input"></div>
  <div class="rub" id="rub"></div>
</section>
<div class="grid">
  <section class="card sys"><h3><span>A</span>System A</h3><div id="sysA"></div></section>
  <section class="card sys"><h3><span>B</span>System B</h3><div id="sysB"></div></section>
</div>
<div class="choices" id="choices">
  <button class="ch" data-w="A"><span>A closer</span><kbd>1</kbd></button>
  <button class="ch" data-w="B"><span>B closer</span><kbd>2</kbd></button>
  <button class="ch" data-w="tie"><span>Tie</span><kbd>3</kbd></button>
  <button class="ch" data-w="neither"><span>Neither</span><kbd>4</kbd></button>
</div>
<div class="hv">
  <section class="card"><p class="lbl">Human verdict</p><div id="hvEdit"></div></section>
  <section class="card"><p class="lbl">Note (optional)</p><textarea id="note" placeholder="Why? Anything odd about this case..."></textarea></section>
</div>
<div class="hint"><kbd>1</kbd>–<kbd>4</kbd> pick winner · <kbd>&larr;</kbd> <kbd>&rarr;</kbd> move between cases · progress saves automatically in this browser</div>
</main>
<script id="csvdata" type="text/plain">__CSV_B64__</script>
<script id="taxonomy" type="application/json">__TAXONOMY_JSON__</script>
<script>
(function(){
const STORE='__STORE_KEY__';
function b64(s){const b=atob(s.trim());const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
__SHARED_LABEL_CSV_JS__
const raw=parseCSV(b64(document.getElementById('csvdata').textContent));
const cols=raw[0];const cases=raw.slice(1).map(r=>{const o={};cols.forEach((c,i)=>o[c]=r[i]??'');return o;});
const J=s=>{try{return JSON.parse(s)}catch(e){return null}};
let st=J(localStorage.getItem(STORE))||{idx:0,lab:{}};
// Intent options come from src/interview_engine/intent_taxonomy.py (embedded at build time).
const TAX=J(document.getElementById('taxonomy').textContent);
function rubricOf(c){const r=J(c.rubric)||{};if(TAX&&r[TAX.key]){const q=Object.assign({},r[TAX.key]);q.criteria={};TAX.order.forEach(k=>q.criteria[k]=TAX.short[k]);r[TAX.key]=q;}return r;}
cases.forEach(c=>{if(!st.lab[c.case_id]&&(c.winner||c.human_verdict||c.review_notes))st.lab[c.case_id]={winner:c.winner,human_verdict:c.human_verdict,review_notes:c.review_notes};});
const MULTI=new Set(TAX&&TAX.multi_select?[TAX.slot]:[]);
function toMulti(slot,hvs){const o=J(hvs);if(!o||typeof o!=='object')return hvs||'';let ch=false;
  Object.keys(o).forEach(k=>{if(TAX&&k===TAX.key&&MULTI.has(slot)&&!Array.isArray(o[k])){o[k]=o[k]===''||o[k]==null?[]:[o[k]];ch=true;}});
  return ch?JSON.stringify(o):hvs;}
function migrate(){cases.forEach(c=>{const L=st.lab[c.case_id];if(L&&L.human_verdict)L.human_verdict=toMulti(c.slot,L.human_verdict);});st.schema=2;}
migrate();localStorage.setItem(STORE,JSON.stringify(st));
const h=parseInt((location.hash.match(/case=(\d+)/)||[])[1]);if(!isNaN(h))st.idx=Math.min(Math.max(h,0),cases.length-1);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const pretty=k=>String(k).replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase());
let tmr;function save(){localStorage.setItem(STORE,JSON.stringify(st));const s=$('saved');s.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>s.classList.remove('on'),900);}
function hvFilled(h){const o=J(h);if(!o||typeof o!=='object')return false;return Object.values(o).some(v=>Array.isArray(v)?v.length>0:(v!==''&&v!=null));}
function hvComplete(c,h){const o=J(h);if(!o||typeof o!=='object')return false;const ks=Object.keys(rubricOf(c)||{});return ks.length>0&&ks.every(k=>Array.isArray(o[k])?o[k].length>0:(o[k]!==''&&o[k]!=null));}
function isDone(L,c){return !!(L&&L.winner&&(L.winner!=='neither'||hvComplete(c,L.human_verdict)));}
function lab(c){return st.lab[c.case_id]||(st.lab[c.case_id]={winner:'',human_verdict:'',review_notes:''});}
function confColor(v){return v>=.85?'var(--ok)':v>=.6?'var(--warn)':'var(--bad)';}
function parseInput(c){const s=c.input_state||'';
  if(c.slot==='scope'){const m=s.match(/Product idea:\s*([\s\S]*?)(?:\nKnown answers:\s*([\s\S]*))?$/);const idea=m?m[1].trim():s;const ka=m&&m[2]?m[2].trim():'';
    return `<p class="lbl">Product idea</p><p class="a">${esc(idea)}</p>${ka?`<div class="ka"><b>Known answers:</b> ${esc(ka)}</div>`:''}`;}
  const m=s.match(/Question:\s*([\s\S]*?)\nFounder answer:\s*([\s\S]*)$/);
  if(m)return `<p class="lbl">Question</p><p class="q">${esc(m[1].trim())}</p><p class="lbl">Answer</p><p class="a">${esc(m[2].trim())}</p>`;
  return `<p class="a">${esc(s)}</p>`;}
function sysHTML(v,cf){v=J(v)||{};cf=J(cf)||{};return Object.keys(v).map(k=>{const val=v[k];const p=cf[k];const pc=typeof p==='number'?p:null;
  return `<div class="field"><div><div class="k">${esc(pretty(k))}</div><div class="val ${esc(val)}">${esc(pretty(val))}</div></div>
  <div class="conf">${pc==null?'<span class="cn">–</span>':`<div class="cbar"><i style="width:${pc*100}%;background:${confColor(pc)}"></i></div><span class="cn">${pc.toFixed(2)}</span>`}</div></div>`;}).join('');}
function render(){const c=cases[st.idx];const L=lab(c);const rub=rubricOf(c)||{};
  $('slot').textContent=c.slot;$('slot').className='badge '+c.slot;$('cid').textContent='case '+c.case_id;
  $('pos').textContent=(st.idx+1)+' / '+cases.length;$('input').innerHTML=parseInput(c);
  $('rub').innerHTML=Object.entries(rub).map(([k,r])=>Object.entries(r.criteria||{}).map(([ck,cv])=>`<span class="chip"><b>${esc(pretty(ck))}</b> · ${esc(cv)}</span>`).join('')).join('');
  $('sysA').innerHTML=sysHTML(c.system_a_verdict,c.system_a_confidence);$('sysB').innerHTML=sysHTML(c.system_b_verdict,c.system_b_confidence);
  document.querySelectorAll('.ch').forEach(b=>b.classList.toggle('sel',b.dataset.w===L.winner));
  const hv=J(L.human_verdict)||{};
  if(MULTI.has(c.slot)){const cur=k=>Array.isArray(hv[k])?hv[k]:(hv[k]?[hv[k]]:[]);
    $('hvEdit').innerHTML=Object.entries(rub).map(([k,r])=>`<div class="row"><label>${esc(pretty(k))} <span class="multi-hint">select all that apply</span></label><div class="checks">${Object.keys(r.criteria||{}).map(o=>`<label class="ck${cur(k).includes(o)?' on':''}"><input type="checkbox" data-k="${esc(k)}" value="${esc(o)}"${cur(k).includes(o)?' checked':''}><span>${esc(pretty(o))}</span></label>`).join('')}</div></div>`).join('');
    $('hvEdit').querySelectorAll('input[type=checkbox]').forEach(x=>x.onchange=()=>{const o={};Object.keys(rub).forEach(k=>{const v=[...$('hvEdit').querySelectorAll('input[data-k="'+k+'"]:checked')].map(i=>i.value);if(v.length)o[k]=v;});
      L.human_verdict=Object.keys(o).length?JSON.stringify(o):'';x.closest('.ck').classList.toggle('on',x.checked);x.blur();save();if(L.winner==='neither')render();else progress();});
  } else {
  $('hvEdit').innerHTML=Object.entries(rub).map(([k,r])=>`<div class="row"><label>${esc(pretty(k))}</label><select data-k="${esc(k)}"><option value="">— choose —</option>${Object.keys(r.criteria||{}).map(o=>`<option value="${esc(o)}"${hv[k]===o?' selected':''}>${esc(pretty(o))}</option>`).join('')}</select></div>`).join('');
  $('hvEdit').querySelectorAll('select').forEach(s=>s.onchange=()=>{const o={};$('hvEdit').querySelectorAll('select').forEach(x=>{if(x.value)o[x.dataset.k]=x.value;});L.human_verdict=Object.keys(o).length?JSON.stringify(o):'';save();if(L.winner==='neither')render();else progress();});
  }
  if(L.winner==='neither'&&!hvComplete(c,L.human_verdict))$('hvEdit').insertAdjacentHTML('beforeend','<p class="hvwarn">Neither: pick the correct verdict yourself - this case is not counted as labeled until you do.</p>');
  $('note').value=L.review_notes||'';
  $('dots').innerHTML=cases.map((x,i)=>{const d=st.lab[x.case_id];return `<div class="dot${isDone(d,x)?' done':(d&&d.winner?' pend':'')}${i===st.idx?' cur':''}" data-i="${i}" title="${esc(x.slot)} · ${esc(x.case_id)}">${i+1}</div>`;}).join('');
  $('dots').querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));
  progress();}
function progress(){const n=cases.filter(c=>isDone(st.lab[c.case_id],c)).length;const pend=cases.filter(c=>{const L=st.lab[c.case_id];return L&&L.winner==='neither'&&!hvComplete(c,L.human_verdict);}).length;$('needv').textContent=pend?pend+' neither case'+(pend>1?'s':'')+' need'+(pend>1?'':'s')+' a verdict':'';$('pct').textContent=n+' / '+cases.length+' labeled';$('barfill').style.width=(n/cases.length*100)+'%';$('total').textContent=cases.length;}
function go(i){if(i<0||i>=cases.length)return;st.idx=i;save();history.replaceState(null,'','#case='+i);render();window.scrollTo({top:0,behavior:'smooth'});}
function pick(w){const c=cases[st.idx];const L=lab(c);L.winner=w;
  if(w==='A'||w==='tie')L.human_verdict=c.system_a_verdict; else if(w==='B')L.human_verdict=c.system_b_verdict; else L.human_verdict='';
  if(L.human_verdict)L.human_verdict=toMulti(c.slot,L.human_verdict);
  save();render();}
document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>pick(b.dataset.w));
$('note').oninput=e=>{lab(cases[st.idx]).review_notes=e.target.value;save();};
$('prev').onclick=()=>go(st.idx-1);$('next').onclick=()=>go(st.idx+1);
document.addEventListener('keydown',e=>{const t=e.target.tagName;if(t==='TEXTAREA'||t==='SELECT'||t==='INPUT'){if(e.key==='Escape')e.target.blur();return;}
  const m={'1':'A','2':'B','3':'tie','4':'neither'};if(m[e.key]){pick(m[e.key]);e.preventDefault();}
  else if(e.key==='ArrowRight')go(st.idx+1);else if(e.key==='ArrowLeft')go(st.idx-1);});
$('exportBtn').onclick=()=>{const out=[cols.map(q).join(',')];cases.forEach(c=>{const L=st.lab[c.case_id]||{};out.push(cols.map(k=>{if(k==='winner')return q(L.winner||'');if(k==='human_verdict')return q(L.human_verdict||'');if(k==='review_notes')return q(L.review_notes||'');return q(c[k]);}).join(','));});
  const blob=new Blob([out.join('\n')+'\n'],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='__EXPORT_NAME__';document.body.appendChild(a);a.click();a.remove();};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const rr=parseCSV(rd.result.replace(/^\ufeff/,''));const hc=rr[0];const ix=n=>hc.indexOf(n);let n=0;
  rr.slice(1).forEach(r=>{const id=r[ix('case_id')];const c=cases.find(x=>x.case_id===id);if(!c)return;const w=r[ix('winner')]||'',hv=r[ix('human_verdict')]||'',nt=r[ix('review_notes')]||'';if(!w&&!hv&&!nt)return;
    st.lab[id]={winner:w,human_verdict:toMulti(c.slot,hv),review_notes:nt};n++;});
  save();render();alert('Imported labels for '+n+' case(s).');e.target.value='';};rd.readAsText(f);};
render();
})();
</script></body></html>
